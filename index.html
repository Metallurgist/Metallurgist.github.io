
<style>
  .brand-socials {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 5px;
  }

  .brand-socials a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    color: #a8c6dc;
    text-decoration: none;
    transition: color .2s ease, transform .2s ease;
  }

  .brand-socials a:hover,
  .brand-socials a:focus-visible {
    color: #70c7f2;
    transform: translateY(-2px);
  }

  .brand-socials svg {
    width: 17px;
    height: 17px;
    fill: currentColor;
  }

  .brand-socials .mail-icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .brand-social-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
</style>

<script>
(function () {
  const brand = document.querySelector(
    '.brand, .logo, .nav-logo, .navbar-brand'
  );

  if (!brand || document.querySelector('.brand-socials')) {
    return;
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'brand-social-wrapper';

  brand.parentNode.insertBefore(wrapper, brand);
  wrapper.appendChild(brand);

  const socials = document.createElement('div');
  socials.className = 'brand-socials';

  const items = [
    {
      label: 'LinkedIn',
      url: 'https://www.linkedin.com/in/mohammed-burhanuddeen-r-02776b91/',
      svg: '<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286ZM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124ZM7.119 20.452H3.555V9h3.564v11.452ZM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0Z"/>'
    },
    {
      label: 'GitHub',
      url: 'https://github.com/metallurgist',
      svg: '<path d="M12 .5a11.5 11.5 0 0 0-3.637 22.41c.575.105.785-.25.785-.555 0-.275-.01-1.005-.015-1.973-3.195.695-3.87-1.54-3.87-1.54-.523-1.33-1.278-1.685-1.278-1.685-1.045-.715.08-.7.08-.7 1.155.08 1.762 1.185 1.762 1.185 1.027 1.76 2.695 1.25 3.352.955.105-.745.402-1.25.73-1.538-2.55-.29-5.23-1.275-5.23-5.685 0-1.255.45-2.28 1.185-3.085-.12-.29-.515-1.46.115-3.045 0 0 .965-.31 3.16 1.18A11.02 11.02 0 0 1 12 5.045c.975.005 1.955.13 2.87.385 2.195-1.49 3.155-1.18 3.155-1.18.63 1.585.235 2.755.115 3.045.74.805 1.185 1.83 1.185 3.085 0 4.42-2.685 5.39-5.245 5.675.415.36.785 1.075.785 2.165 0 1.565-.015 2.825-.015 3.21 0 .31.21.67.79.555A11.5 11.5 0 0 0 12 .5Z"/>'
    },
    {
      label: 'Email',
      url: 'mailto:rmohammedburhanuddeen@gmail.com',
      svg: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/>',
      mail: true
    }
  ];

  items.forEach(item => {
    const a = document.createElement('a');
    a.href = item.url;
    a.setAttribute('aria-label', item.label);
    a.title = item.label;

    if (!item.mail) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }

    a.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true" ' +
      (item.mail ? 'class="mail-icon"' : '') +
      '>' + item.svg + '</svg>';

    socials.appendChild(a);
  });

  wrapper.appendChild(socials);
})();
</script>
